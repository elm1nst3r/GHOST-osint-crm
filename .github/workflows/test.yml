# Runs the backend and frontend test suites on every push and pull request.
#
# The suite needs no database. Besides unit tests it holds the guards that keep
# the OpenAPI document honest (utils/openapiCoverage.test.js): every route
# documented, query parameters and admin flags matching the handlers. The
# catalogue build is run too, because it checks what the MCP server will make of
# the document — tool-name collisions and argument names MCP clients reject.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run tests
        working-directory: backend
        run: npm test

      - name: Build API catalogue (checks MCP tool generation)
        working-directory: backend
        run: node scripts/build-api-docs.js "$RUNNER_TEMP/api-docs"

  # Frontend: lint, unit tests (jsdom) and component tests in a real Chromium
  # (Vitest browser mode). The unit tests include the RTL guard
  # (src/rtl.test.js): UI code must use logical direction classes
  # (ms-/pe-/start-/text-start…) so the layout mirrors for right-to-left
  # languages. The production build runs too, so a broken import fails here
  # instead of in the Docker image.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Install Chromium for component tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Component tests (browser)
        working-directory: frontend
        run: npm run test:browser

      - name: Build
        working-directory: frontend
        run: npm run build
