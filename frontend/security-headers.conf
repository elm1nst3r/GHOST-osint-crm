# Security headers for every page and static file GHOST serves.
# Included in each location below: nginx drops server-level add_header lines
# in any location that has its own, so they can't live in one place.
# /api and /public are proxied to the backend, which sets its own (helmet).

# Content-Security-Policy (strict since 3.0, the move to Vite):
# - script-src 'self': only the bundled files run. The build has no inline
#   script, so injected markup (e.g. a hostile name in a record) can't run code.
# - connect-src 'self': the app only talks to its own /api. A script that got
#   in anyway couldn't send data to another host with fetch or WebSockets.
# - img-src https: map tiles, plus profile pictures linked from other sites.
#   data:/blob: are image previews and pasted or converted images.
# - style-src 'unsafe-inline': React and Leaflet set inline styles. Styles
#   can't run code; the script policy is what matters.
# - frame-src/worker-src blob:: the PDF preview shows a blob: document.
# - Framing, plugins and <base> hijacking are refused.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# Clicking out to an OSINT source must not tell it where GHOST runs. Map
# tiles opt back in to sending the origin (OpenStreetMap's usage policy).
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), publickey-credentials-get=(self), publickey-credentials-create=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# HSTS only when a proxy in front says the request came over HTTPS
# ($ghost_hsts is empty otherwise, and nginx then sends no header).
add_header Strict-Transport-Security $ghost_hsts always;
