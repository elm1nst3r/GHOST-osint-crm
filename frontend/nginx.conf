# HSTS is sent only behind an HTTPS proxy that sets X-Forwarded-Proto.
# No includeSubDomains: other services on the same domain aren't ours to pin.
map $http_x_forwarded_proto $ghost_hsts {
    https   "max-age=31536000";
    default "";
}

# Behind a proxy that terminates HTTPS, pass on what it reports: this nginx
# itself only ever sees http, and telling the backend so makes it drop the
# Secure session cookie (sign-in then "works" but never sticks, #115).
# Without a proxy, nginx's own scheme as before.
map $http_x_forwarded_proto $ghost_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen       80;
    server_name  localhost;
    # Don't advertise the nginx version.
    server_tokens off;

    # Increase max upload size for KML files (WiGLE exports can be several MB)
    client_max_body_size 20M;

    # index.html must never be cached so new JS bundles are picked up immediately
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Hashed JS/CSS assets are immutable — cache aggressively
    location ~* \.(js|css)$ {
        include /etc/nginx/snippets/security-headers.conf;
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Serve static files
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Files are served as files, every other path gets the app. No `$uri/`:
        # the build's /assets/ folder would turn the Assets section's URL
        # (/assets) into a redirect to the folder, on the container's port.
        try_files $uri /index.html;
    }

    # File uploads (issue #97). Keep this at or above the backend's
    # FILES_MAX_BYTES (default 50 MB), or nginx rejects the upload first.
    location /api/files {
        client_max_body_size 100M;
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ghost_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy API requests to backend
    location /api {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ghost_forwarded_proto;
    }

    # Proxy for uploaded files
    location /public {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ghost_forwarded_proto;
    }

    # Error page
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        include /etc/nginx/snippets/security-headers.conf;
        root   /usr/share/nginx/html;
    }
}